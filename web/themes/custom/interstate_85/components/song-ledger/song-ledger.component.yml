$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/metadata.schema.json'
name: Song ledger
status: experimental
description: >-
  The Songs landing's A–Z list: a sticky letter rail plus grouped title
  columns (design-system.md §3 "Song ledger"). The caller supplies rows
  already sorted (article-insensitively, FR-8) and grouped by the same rule
  — this component only renders them, it does not sort or group.
props:
  type: object
  properties:
    results_count:
      type: integer
      title: Results count
      description: 'The number of songs shown, for the "N results" line.'
    rail_letters:
      type: array
      title: Rail letters
      description: >-
        A–Z then a trailing "#", each { letter, present, id }. Present letters
        render as links to `#id`; absent ones are muted, inert text. `id` is
        the same value the matching group carries, computed once by the
        caller (INT8-030) so the link and its target cannot drift.
    groups:
      type: array
      title: Groups
      description: >-
        Ordered groups, each { letter, id, songs }; each song is
        { title, url, is_alt }. is_alt marks an alternate-title version
        (FR-10) with the small "alt" cue. `id` becomes the group header's
        anchor target for the rail (INT8-030).
  required:
    - rail_letters
    - groups
