$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/metadata.schema.json'
name: Site header
status: experimental
description: >-
  The Interstate-8 page header. Two variants: solid (default — secondary
  pages, and the homepage once scrolled) and transparent (over the homepage
  hero, pre-scroll). Branding and primary nav are passed in as slots so the
  component stays decoupled from block/menu configuration.
props:
  type: object
  properties:
    variant:
      type: string
      title: Variant
      description: 'solid (default) or transparent.'
      enum:
        - solid
        - transparent
      default: solid
slots:
  branding:
    title: Branding
    description: 'The site branding block markup (badge + wordmark).'
  nav:
    title: Primary navigation
    description: 'The rendered primary_menu region markup.'
libraryOverrides:
  # Auto-discovered css/js stay as-is; this only exists to force dependencies,
  # which Drupal\Core\Theme\ComponentPluginManager only adds when
  # libraryOverrides is present:
  # - core/drupal: without it, Drupal.behaviors in site-header.js could run
  #   before core/drupal defines the Drupal global.
  # - core/drupal.active-link: a redundant *secondary* marker, kept
  #   deliberately. Since INT8-031 the primary nav's current-section marking
  #   is server-rendered by interstate_85_preprocess_menu__main() from the
  #   route-based active trail, because core's own active-link matching —
  #   this library, and its identical PHP twin ActiveLinkResponseFilter — is
  #   query-exact and so drops the marking the moment the Songs filters add
  #   ?type=… to the URL. The library is harmless alongside that (it targets
  #   the same <a>, and classList.add()/setAttribute() are idempotent; core
  #   also guards against double-marking explicitly), and it still serves any
  #   other menu rendered with set_active_class, e.g. the footer menu
  #   arriving in INT8-026.
  dependencies:
    - core/drupal
    - core/drupal.active-link

