$schema: 'https://git.drupalcode.org/project/drupal/-/raw/HEAD/core/modules/sdc/src/metadata.schema.json'
name: Segmented toggle
status: experimental
description: >-
  A two-option segmented control (e.g. Alternate Titles Show/Hide). Renders
  as a labelled button group by default (presentation only — the consumer
  wires the actual value). If href_a/href_b are set, renders as a pair of
  links instead (each carrying an accessible "<group label>: <option>" name,
  and the active one marked aria-current) — for a control whose two states
  are two real pages, reached without JS or form submission.
props:
  type: object
  properties:
    label:
      type: string
      title: Group label
      description: 'Accessible label for the group, e.g. "Alternate titles".'
    selected:
      type: string
      title: Selected option
      description: 'Which option is currently active: a or b.'
      enum:
        - a
        - b
      default: a
    href_a:
      type: string
      title: Option A href
      description: 'If set (with href_b), renders as links rather than buttons.'
    href_b:
      type: string
      title: Option B href
    option_a_label:
      type: string
      title: Option A accessible name
      description: 'Plain text used for the link variant''s aria-label (e.g. "Show"); ignored in button mode.'
    option_b_label:
      type: string
      title: Option B accessible name
  required:
    - label
slots:
  option_a:
    title: Option A label
    description: 'e.g. "Show".'
  option_b:
    title: Option B label
    description: 'e.g. "Hide".'
